# rustyac.com: static files from `astro build`. Copied to /etc/nginx/conf.d/default.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's own list already knows .webp and .avif; .glb is missing from it.
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
    }

    # text/html is always compressed. The GLBs are meshopt-packed, which is made to be gzipped on top
    # (f2004.glb goes from 3.45 MB to 3.07 MB).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml
               application/xml text/plain model/gltf-binary;

    # Hashed build output: the file name changes whenever the content does.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Models, textures and the share image: loaded with ?v=<package version>, so a month is safe.
    location ~ ^/(models|textures|og)/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Pages (and the few small root files): always revalidate.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
